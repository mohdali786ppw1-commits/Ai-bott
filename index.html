<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>He's Here ✦</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
width:100%;
overflow:hidden;
background:url('https://i.ibb.co/yFr7KjPL/1778786147560.png') center/cover no-repeat;
display:flex;
justify-content:center;
align-items:center;
}

.chat-container{
width:100%;
height:100vh;
background:rgba(15,15,15,0.45);
backdrop-filter:blur(14px);
display:flex;
flex-direction:column;
transition:0.4s;
}

.header{
padding:18px;
display:flex;
align-items:center;
gap:12px;
background:rgba(32,32,32,0.8);
border-bottom:1px solid rgba(255,255,255,0.06);
}

.avatar{
width:52px;
height:52px;
border-radius:50%;
background:url('YOUR_IMAGE_HERE') center/cover;
}

.header h2{color:white;font-size:17px;}
.header p{color:#aaa;font-size:12px;}

.chat-box{
flex:1;
overflow-y:auto;
padding:15px;
display:flex;
flex-direction:column;
gap:10px;
}

.message{
padding:12px 14px;
border-radius:16px;
max-width:80%;
font-size:14px;
animation:pop .25s ease;
word-wrap:break-word;
}

.bot{align-self:flex-start;background:#2a2a2a;color:white;}
.user{align-self:flex-end;background:#6d5cff;color:white;}

@keyframes pop{
from{transform:scale(0.95);opacity:0;}
to{transform:scale(1);opacity:1;}
}

/* input */
.input-area{
display:flex;
gap:10px;
padding:12px;
background:rgba(32,32,32,0.8);
}

input{
flex:1;
padding:14px;
border:none;
outline:none;
border-radius:14px;
background:#2c2c2c;
color:white;
}

button{
padding:14px 18px;
border:none;
border-radius:14px;
background:#6d5cff;
color:white;
cursor:pointer;
}

/* typing */
.typing{
display:flex;
gap:4px;
padding:12px 14px;
border-radius:16px;
background:#2a2a2a;
width:fit-content;
}

.dot{
width:6px;
height:6px;
background:#aaa;
border-radius:50%;
animation:bounce 1s infinite;
}

.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}

@keyframes bounce{
0%,100%{transform:translateY(0);opacity:0.5;}
50%{transform:translateY(-5px);opacity:1;}
}

/* mood glow */
:root{ --mood-color:#6d5cff; }

.chat-container{
box-shadow:0 0 25px var(--mood-color);
}

.mood-flash{
position:fixed;
top:10px;
right:10px;
padding:8px 12px;
border-radius:12px;
background:rgba(0,0,0,0.5);
color:white;
font-size:12px;
animation:fadeMood 2s ease;
}

@keyframes fadeMood{
0%{opacity:0;transform:translateY(-5px);}
20%{opacity:1;}
100%{opacity:0;transform:translateY(-5px);}
}

</style>
</head>

<body>

<audio id="typeSound" src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3"></audio>
<audio id="heartSound" src="https://assets.mixkit.co/sfx/preview/mixkit-fast-heartbeat-2967.mp3"></audio>
<audio id="rainSound" loop src="https://assets.mixkit.co/sfx/preview/mixkit-rain-loop-1247.mp3"></audio>
<audio id="sunSound" loop src="https://assets.mixkit.co/sfx/preview/mixkit-morning-birds-ambience-2473.mp3"></audio>

<div class="chat-container">

<div class="header">
<div class="avatar"></div>
<div>
<h2>He's Here ✦</h2>
<p>Even when he's busy 🤍</p>
</div>
</div>

<div class="chat-box" id="chatBox"></div>

<div class="input-area">
<input id="userInput" placeholder="Talk / game / bored / game">
<button onclick="sendMessage()">Send</button>
</div>

</div>

<script>

const API_KEY = "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";

const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");

let messages = [
{role:"system",content:"Soft hinglish boyfriend. Short replies (1–3 lines)."}
];

let moodHistory = [];
let score = 0;
let secretNumber = Math.floor(Math.random()*10)+1;

/* add message */
function addMessage(text,type){
const div=document.createElement("div");
div.classList.add("message",type);
div.innerText=text;
chatBox.appendChild(div);
chatBox.scrollTop=chatBox.scrollHeight;
}

/* mood detect */
function detectMood(text){
text=text.toLowerCase();
if(text.includes("sad")||text.includes("😭"))return"sad";
if(text.includes("love")||text.includes("🥺"))return"cute";
if(text.includes("haha")||text.includes("happy"))return"happy";
return"neutral";
}

/* emotion response */
function emotion(mood){
if(mood==="sad"){
addMessage("aap sad lag rahi ho... mai yahi hu 🤍","bot");
}
if(mood==="happy"){
addMessage("aap khush ho toh acha lagta hai ☀️","bot");
}
if(mood==="cute"){
addMessage("aap bohot cute ho 🥺🤍","bot");
}
}

/* mood system */
function applyMood(mood){

const rain=document.getElementById("rainSound");
const sun=document.getElementById("sunSound");

rain.pause();sun.pause();

let color="#6d5cff";

if(mood==="sad"){color="#60a5fa";rain.play();}
if(mood==="happy"){color="#facc15";sun.play();}
if(mood==="cute"){color="#f472b6";}

document.documentElement.style.setProperty("--mood-color",color);

moodHistory.push(mood);
emotion(mood);

const flash=document.createElement("div");
flash.className="mood-flash";
flash.innerText="Mood: "+mood;
document.body.appendChild(flash);
setTimeout(()=>flash.remove(),2000);
}

/* 🎮 GAMES SYSTEM */
function handleGame(text){

text=text.toLowerCase();

/* menu */
if(text==="game"){
addMessage("🎮 rps rock/paper/scissors\n🎯 guess 1-10\n🏆 score system active","bot");
return true;
}

/* bored reaction */
if(text==="bored"){
addMessage("chalo game khelte hain 😏 type: game","bot");
return true;
}

/* RPS */
if(text.startsWith("rps")){
let user=text.split(" ")[1];
let bot=["rock","paper","scissors"][Math.floor(Math.random()*3)];

if(!user){
addMessage("use: rps rock/paper/scissors","bot");
return true;
}

let result="";
if(user===bot)result="Draw 🤝";
else if(
(user==="rock"&&bot==="scissors")||
(user==="paper"&&bot==="rock")||
(user==="scissors"&&bot==="paper")
){
result="You win 🎉";score++;
}else{
result="I win 😏";score--;
}

addMessage(`You:${user}\nMe:${bot}\n${result}\n🏆 Score:${score}`,"bot");
return true;
}

/* GUESS */
if(text.startsWith("guess")){
let g=parseInt(text.split(" ")[1]);
if(!g){addMessage("use: guess 1-10","bot");return true;}

if(g===secretNumber){
addMessage("🎉 correct! new number set","bot");
score++;
secretNumber=Math.floor(Math.random()*10)+1;
}else if(g>secretNumber){
addMessage("📉 too high","bot");
}else{
addMessage("📈 too low","bot");
score--;
}
addMessage("🏆 Score:"+score,"bot");
return true;
}

return false;
}

/* SEND */
async function sendMessage(){

let text=userInput.value.trim();
if(!text)return;

if(handleGame(text))return;

addMessage(text,"user");
userInput.value="";

messages.push({role:"user",content:text});

document.getElementById("typeSound").play();

const typing=document.createElement("div");
typing.className="typing";
typing.innerHTML="<div class='dot'></div><div class='dot'></div><div class='dot'></div>";
chatBox.appendChild(typing);

try{

const res=await fetch("https://openrouter.ai/api/v1/chat/completions",{
method:"POST",
headers:{
"Authorization":`Bearer ${API_KEY}`,
"Content-Type":"application/json"
},
body:JSON.stringify({
model:"openai/gpt-3.5-turbo",
messages:messages
})
});

const data=await res.json();

typing.remove();

let reply=data.choices[0].message.content;

messages.push({role:"assistant",content:reply});

addMessage(reply,"bot");

document.getElementById("heartSound").play();

let mood=detectMood(reply);
applyMood(mood);

}catch(e){
typing.remove();
addMessage("error 😭","bot");
}

}

userInput.addEventListener("keypress",(e)=>{
if(e.key==="Enter")sendMessage();
});

</script>

</body>
</html>
